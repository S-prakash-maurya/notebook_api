name: Mirror Main Branch

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image"
    types:
      - completed
    branches:
      - main

jobs:
  mirror:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Mirror Source Repository to Target Repository
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}

          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}

          SOURCE_REPO: "DevRootAccess/note-book-api-services"
          TARGET_REPO: "S-prakash-maurya/notebook_api"

          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |
          set -e

          echo "========================================"
          echo "Starting Repository Mirror"
          echo "========================================"

          echo "Source Repository: $SOURCE_REPO"
          echo "Target Repository: $TARGET_REPO"
          echo "Source Commit: $SOURCE_SHA"

          # ---------------------------------------------------------
          # Git configuration
          # ---------------------------------------------------------

          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

          # ---------------------------------------------------------
          # Temporary directory
          # ---------------------------------------------------------

          WORK_DIR="$(mktemp -d)"
          TARGET_DIR="$WORK_DIR/target"

          cleanup() {
            echo ""
            echo "========================================"
            echo "Cleaning up"
            echo "========================================"

            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR" || true

              # Remove remotes containing credentials
              git remote remove source 2>/dev/null || true
              git remote remove origin 2>/dev/null || true

              # Remove Git config containing credentials
              rm -f .git/config
            fi

            # Delete entire temporary workspace
            rm -rf "$WORK_DIR"

            echo "Cleanup completed."
          }

          trap cleanup EXIT

          # ---------------------------------------------------------
          # Clone TARGET repository
          # ---------------------------------------------------------

          echo ""
          echo "Cloning target repository..."

          git clone \
            "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" \
            "$TARGET_DIR"

          cd "$TARGET_DIR"

          # ---------------------------------------------------------
          # Add SOURCE repository
          # ---------------------------------------------------------

          echo ""
          echo "Adding source repository..."

          git remote add source \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git"

          # ---------------------------------------------------------
          # Fetch target
          # ---------------------------------------------------------

          echo ""
          echo "Fetching target repository..."

          git fetch origin --prune

          # ---------------------------------------------------------
          # Fetch source
          # ---------------------------------------------------------

          echo ""
          echo "Fetching source repository..."

          git fetch source main

          # ---------------------------------------------------------
          # Verify source commit
          # ---------------------------------------------------------

          echo ""
          echo "Verifying source commit..."

          if git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            echo "Source commit exists."
          else
            echo "ERROR: Source commit not found."
            exit 1
          fi

          # ---------------------------------------------------------
          # Check target main branch
          # ---------------------------------------------------------

          echo ""
          echo "Checking target main branch..."

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then

            echo "Target main branch exists."

            git checkout main

          else

            echo "Target main branch does not exist."

            git checkout -b main

          fi

          # ---------------------------------------------------------
          # Merge exact source commit
          # ---------------------------------------------------------

          echo ""
          echo "========================================"
          echo "Merging Source → Target"
          echo "========================================"

          if git merge "$SOURCE_SHA" \
            --allow-unrelated-histories \
            --no-edit; then

            echo "Merge successful."

          else

            echo ""
            echo "ERROR: Merge conflict detected."

            echo ""
            echo "Conflicting files:"

            git diff --name-only --diff-filter=U || true

            echo ""
            echo "Aborting merge..."

            git merge --abort || true

            exit 1

          fi

          # ---------------------------------------------------------
          # Push TARGET main
          # ---------------------------------------------------------

          echo ""
          echo "========================================"
          echo "Pushing Target Repository"
          echo "========================================"

          git push origin main:main

          echo ""
          echo "Push successful."

          # ---------------------------------------------------------
          # Remove Git configuration
          # ---------------------------------------------------------

          git remote remove source 2>/dev/null || true
          git remote remove origin 2>/dev/null || true

          rm -f .git/config

          echo ""
          echo "========================================"
          echo "Mirror completed successfully"
          echo "========================================"
