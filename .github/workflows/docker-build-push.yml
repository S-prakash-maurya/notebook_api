name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version
        id: version
        run: |
          VERSION="${GITHUB_SHA::7}"

          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update OpenAPI Version
        run: |
          FILE="auth-service/src/main/java/com/micro/auth/config/OpenApiConfig.java"

          echo "Updating OpenAPI version to: $VERSION"

          sed -i "s/\.version(\"[^\"]*\")/.version(\"$VERSION\")/" "$FILE"

          echo "Updated version:"
          grep -n '\.version(' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        id: build_image
        run: |
          docker build \
            -t devshivmohan/note-book-api-services:latest \
            ./auth-service

          IMAGE_ID=$(docker images -q devshivmohan/note-book-api-services:latest)

          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push devshivmohan/note-book-api-services:latest

      - name: List Docker Images
        run: docker images

      - name: Cleanup Docker
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Send Email Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Note Book Service Backend Pipeline Success | Version: ${{ env.VERSION }} | Image ID: ${{ env.IMAGE_ID }}"
          to: ntrstark@gmail.com,sprakash8317@gmail.com,yadavramprasad563@gmail.com,amansingh3897702@gmail.com,rathourm99@gmail.com
          from: GitHub Actions Alerts Generator
          body: |
            🚀 Docker image pushed successfully.

            📦 Image Details:
            - Repository: devshivmohan/note-book-api-services
            - Tag: latest
            - Image ID: ${{ env.IMAGE_ID }}

            🔖 Application Version:
            - Version: ${{ env.VERSION }}
            - Commit: ${{ github.sha }}

            🔧 Build Info:
            - Repo: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Triggered by: ${{ github.actor }}
            - Commit message: ${{ github.event.head_commit.message }}

            🕒 Run ID: ${{ github.run_id }}